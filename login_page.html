<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login_style.css">
</head>
<body>
    <div class="login-container">
        <div class="left">
            <h1>Campusly</h1>
            <p id="first">Welcome to College Explorer!
            <br><b>Discover. Compare. Choose.</b></p>
               <p id="sec"><i>Explore colleges, discover courses, compare opportunities, and keep track of your applications — all in one place.
            </i></p>
            <button>Explore Colleges</button>

        </div>
        <div class="right">
            <h2>Login</h2>
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <button class="login-bt">Sign In</button>
        </div>

    </div>

</body>
</html>
